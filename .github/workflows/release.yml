name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build & Package MediaPulse Pro (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pyinstaller pillow

      - name: Download Static FFmpeg for Release Packaging
        shell: powershell
        run: |
          if (!(Test-Path "bin\ffmpeg.exe")) {
            New-Item -ItemType Directory -Force -Path "bin"
            Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
            Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
            Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Copy-Item -Destination "bin\ffmpeg.exe"
          }

      - name: Run Automated Test Suite
        shell: powershell
        run: |
          python -m pytest tests -m "not slow" -v

      - name: Build Executable with PyInstaller
        shell: powershell
        run: |
          python -m PyInstaller --clean MediaPulsePro.spec --noconfirm

      - name: Archive Distribution into Zip
        shell: powershell
        run: |
          Compress-Archive -Path "dist\MediaPulsePro\*" -DestinationPath "dist\MediaPulsePro-${{ github.ref_name }}-Windows-x64.zip"

      - name: Create GitHub Release and Attach Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: MediaPulse Pro ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/MediaPulsePro-${{ github.ref_name }}-Windows-x64.zip
            dist/MediaPulsePro/MediaPulsePro.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
